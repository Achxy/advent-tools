[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advent-tools"
version = "1.0.0b1"
authors = [{name ="Achyuth Jayadevan", email = "achyuth@jayadevan.in"}]
description = "Cool set of tools for working with Advent of Code challenges"
readme = "README.md"
keywords = ["advent", "advent of code", "advent tools", "aoc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.3.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    # Python < 3.11 backports
    "tomli>=2.0.0; python_version < '3.11'",
    "importlib_resources>=6.0.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Achxy/advent-tools.git"
"Bug Tracker" = "https://github.com/Achxy/advent-tools/issues"

[tool.hatch.build.targets.sdist]
exclude = [".venv/"]

[tool.hatch.build.targets.wheel]
packages = ["advent/"]

[tool.pyright]
venv = ".venv"
venvPath = "."
reportUnnecessaryTypeIgnoreComment = "warning"
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["advent", "tests"]
exclude = ["advent/x.py", ".venv"]

[tool.ruff]
line-length = 125
target-version = "py310"
exclude = ["advent/x.py"]  # scratch file

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["advent"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = true

[dependency-groups]
dev = []
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
]
lint = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]
